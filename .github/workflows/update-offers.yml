name: Update Student Pack Offers

on:
  schedule:
    - cron: "0 0 * * *"   # Runs automatically every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cheerio
        run: npm i cheerio --no-save

      - name: Run scraper
        run: node scripts/update-offers.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/pack-offers.json
          if ! git diff --quiet --cached; then
            git commit -m "chore: update student pack offers [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
